                    "q": "অস্থায়ী সংবিধান আদেশ কী",
                    "a": "**ভূমিকা:**\n\nঅস্থায়ী সংবিধান আদেশ ছিল ১৯৭১ সালে মুক্তিযুদ্ধের সময় গঠিত অস্থায়ী সরকারের শাসন পরিচালনার জন্য প্রণীত একটি সাময়িক সাংবিধানিক দলিল। এটি স্বাধীন বাংলাদেশের প্রথম সাংবিধানিক কাঠামো হিসেবে কাজ করে এবং মুক্তিযুদ্ধকালীন সময়ে রাষ্ট্র পরিচালনা, আইন-শৃঙ্খলা রক্ষা এবং সরকারি কার্যক্রম পরিচালনার জন্য একটি আইনি ভিত্তি প্রদান করে।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n**মূল বিষয়বস্তু:**\n\n*   **প্রণয়ন:** ১৯৭১ সালের ১০ এপ্রিল মুজিবনগরে অস্থায়ী সরকার গঠনের পর ১১ এপ্রিল 'অস্থায়ী সংবিধান আদেশ, ১৯৭১' জারি করা হয়। এটি বাংলাদেশের সাংবিধানিক ইতিহাসে প্রথম আনুষ্ঠানিক দলিল।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n*   **উদ্দেশ্য:** মুক্তিযুদ্ধকালীন সময়ে রাষ্ট্র পরিচালনা, আইন-শৃঙ্খলা রক্ষা এবং সরকারি কার্যক্রম পরিচালনার জন্য একটি আইনি ভিত্তি প্রদান করা। এটি অস্থায়ী সরকারের কার্যক্রমকে আইনি স্বীকৃতি দেয় এবং আন্তর্জাতিক মহলে বাংলাদেশের স্বাধীনতা সংগ্রামের বৈধতা প্রতিষ্ঠায় সহায়ক হয়।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n*   **মূল বৈশিষ্ট্য:**\n    \n    *   _রাষ্ট্রপতিশাসিত ব্যবস্থা:_ অস্থায়ী সংবিধান আদেশে রাষ্ট্রপতিশাসিত ব্যবস্থা প্রবর্তন করা হয়। বঙ্গবন্ধু শেখ মুজিবুর রহমান রাষ্ট্রপতি এবং সৈয়দ নজরুল ইসলাম উপরাষ্ট্রপতি হিসেবে দায়িত্ব পালন করেন।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n    \n    *   _মন্ত্রিপরিষদ গঠন:_ অস্থায়ী সরকারের মন্ত্রিপরিষদ গঠন ও ক্ষমতা বণ্টনের বিধান রাখা হয়। তাজউদ্দিন আহমদ প্রধানমন্ত্রী হিসেবে দায়িত্ব পালন করেন।\n    \n    *   _গণপরিষদ গঠনের পরিকল্পনা:_ জাতীয় সংসদের পরিবর্তে গণপরিষদ গঠনের পরিকল্পনা করা হয়, যা স্বাধীনতার পর সংবিধান প্রণয়নের দায়িত্ব পালন করবে।\n    \n    *   _অস্থায়ী রাজধানী:_ মুজিবনগরকে অস্থায়ী রাজধানী ঘোষণা করা হয়।\n\n*   **মেয়াদ:** ১৯৭২ সালের ১৬ ডিসেম্বর চূড়ান্ত সংবিধান কার্যকর হওয়ার আগ পর্যন্ত এটি কার্যকর ছিল। ১৯৭২ সালের ১২ জানুয়ারি বঙ্গবন্ধু বাংলাদেশে ফিরে আসার পর অস্থায়ী সরকারের কার্যক্রম সমাপ্ত হয় এবং চূড়ান্ত সংবিধান প্রণয়নের প্রক্রিয়া শুরু হয়।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n*   **ঐতিহাসিক গুরুত্ব:** এটি বাংলাদেশের সাংবিধানিক ইতিহাসে প্রথম আনুষ্ঠানিক দলিল এবং স্বাধীন রাষ্ট্রের শাসন কাঠামো প্রতিষ্ঠায় ভূমিকা রাখে। এটি আন্তর্জাতিক মহলে বাংলাদেশের স্বাধীনতা সংগ্রামের বৈধতা প্রতিষ্ঠায় সহায়ক হয় এবং মুক্তিযুদ্ধকালীন সময়ে অস্থায়ী সরকারের কার্যক্রমকে আইনি স্বীকৃতি দেয়।\n\n**উপসংহার:**\n\nঅস্থায়ী সংবিধান আদেশ মুক্তিযুদ্ধের সময় বাংলাদেশের অস্থায়ী সরকারের আইনি ভিত্তি হিসেবে কাজ করে এবং পরবর্তীতে ১৯৭২ সালের চূড়ান্ত সংবিধান প্রণয়নের পথ প্রশস্ত করে। এটি বাংলাদেশের সাংবিধানিক ইতিহাসে একটি গুরুত্বপূর্ণ মাইলফলক এবং স্বাধীন রাষ্ট্রের শাসন কাঠামো প্রতিষ্ঠায় ভূমিকা রাখে।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n* * *\n\n* * *\n\n**ভূমিকা:**\n\nঅস্থায়ী সংবিধান আদেশ ছিল ১৯৭১ সালে মুক্তিযুদ্ধের সময় গঠিত অস্থায়ী সরকারের শাসন পরিচালনার জন্য প্রণীত একটি সাময়িক সাংবিধানিক দলিল। এটি স্বাধীন বাংলাদেশের প্রথম সাংবিধানিক কাঠামো হিসেবে কাজ করে।\\[[banglastream](https://banglastream.net/op-ed/column/bshmoresyrap)\\]\n\n**মূল বিষয়বস্তু:**\n\n*   **প্রণয়ন:** ১৯৭১ সালের ১০ এপ্রিল মুজিবনগরে অস্থায়ী সরকার গঠনের পর ১১ এপ্রিল 'অস্থায়ী সংবিধান আদেশ, ১৯৭১' জারি করা হয়।\\[[banglastream](https://banglastream.net/op-ed/column/bshmoresyrap)\\]\n\n*   **উদ্দেশ্য:** মুক্তিযুদ্ধকালীন সময়ে রাষ্ট্র পরিচালনা, আইন-শৃঙ্খলা রক্ষা এবং সরকারি কার্যক্রম পরিচালনার জন্য একটি আইনি ভিত্তি প্রদান করা।\\[[banglastream](https://banglastream.net/op-ed/column/bshmoresyrap)\\]\n\n*   **মূল বৈশিষ্ট্য:**\n    \n    *   রাষ্ট্রপতিশাসিত ব্যবস্থা প্রবর্তন (বঙ্গবন্ধু শেখ মুজিবুর রহমান রাষ্ট্রপতি, সৈয়দ নজরুল ইসলাম উপরাষ্ট্রপতি)।\n    \n    *   মন্ত্রিপরিষদ গঠন ও ক্ষমতা বণ্টনের বিধান।\n    \n    *   জাতীয় সংসদের পরিবর্তে গণপরিষদ গঠনের পরিকল্পনা।\n\n*   **মেয়াদ:** ১৯৭২ সালের ১৬ ডিসেম্বর চূড়ান্ত সংবিধান কার্যকর হওয়ার আগ পর্যন্ত এটি কার্যকর ছিল।\\[[banglastream](https://banglastream.net/op-ed/column/bshmoresyrap)\\]\n\n*   **ঐতিহাসিক গুরুত্ব:** এটি বাংলাদেশের সাংবিধানিক ইতিহাসে প্রথম আনুষ্ঠানিক দলিল এবং স্বাধীন রাষ্ট্রের শাসন কাঠামো প্রতিষ্ঠায় ভূমিকা রাখে।\n\n**উপসংহার:**\n\nঅস্থায়ী সংবিধান আদেশ মুক্তিযুদ্ধের সময় বাংলাদেশের অস্থায়ী সরকারের আইনি ভিত্তি হিসেবে কাজ করে এবং পরবর্তীতে ১৯৭২ সালের চূড়ান্ত সংবিধান প্রণয়নের পথ প্রশস্ত করে।\\[[banglastream](https://banglastream.net/op-ed/column/bshmoresyrap)\\]"

                    "q": "১৯৭২ সালের সংবিধানের বৈশিষ্ট্যসমূহ আলোচনা কর।",
                    "a": "**ভূমিকা:**\n\n১৯৭২ সালের সংবিধান হলো স্বাধীন ও সার্বভৌম বাংলাদেশের সর্বোচ্চ আইন। এটি ১৯৭২ সালের ৪ নভেম্বর গণপরিষদে গৃহীত এবং ১৬ ডিসেম্বর কার্যকর হয়। এটি বাংলাদেশের রাষ্ট্রীয় কাঠামো ও গণতান্ত্রিক মূল্যবোধের ভিত্তি। ১৯৭২ সালের সংবিধান বাংলাদেশের স্বাধীনতা সংগ্রামের আদর্শ ও চেতনাকে প্রতিফলিত করে এবং দেশের গণতান্ত্রিক কাঠামো, মৌলিক অধিকার ও রাষ্ট্রীয় মূলনীতির ভিত্তি স্থাপন করে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n**মূল বিষয়বস্তু:**\n\n*   **লিখিত ও সংক্ষিপ্ত:** সংবিধানটি লিখিত দলিল; ১৫৩টি অনুচ্ছেদ, ১১টি ভাগ, ১টি প্রস্তাবনা ও ৪টি তফসিল সম্বলিত। এটি একটি সংক্ষিপ্ত কিন্তু পূর্ণাঙ্গ দলিল, যা রাষ্ট্র পরিচালনার সকল দিক কভার করে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\\[[topsuggestionbd](https://topsuggestionbd.com/%E0%A7%A7%E0%A7%AF%E0%A7%AD%E0%A7%A8-%E0%A6%B8%E0%A6%BE%E0%A6%B2%E0%A7%87%E0%A6%B0-%E0%A6%B8%E0%A6%82%E0%A6%AC%E0%A6%BF%E0%A6%A7%E0%A6%BE%E0%A6%A8%E0%A7%87%E0%A6%B0-%E0%A6%AC%E0%A7%88%E0%A6%B6/)\\]\n\n*   **প্রস্তাবনা:** জাতীয়তাবাদ, সমাজতন্ত্র, গণতন্ত্র ও ধর্মনিরপেক্ষতা—এই চারটি মূলনীতি রাষ্ট্র পরিচালনার ভিত্তি হিসেবে ঘোষিত। এগুলো বাংলাদেশের স্বাধীনতা সংগ্রামের আদর্শ ও চেতনাকে প্রতিফলিত করে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n*   **মৌলিক অধিকার:** অনুচ্ছেদ ২৭-৪৭ পর্যন্ত নাগরিকদের মৌলিক অধিকার (সমানতা, বাকস্বাধীনতা, ধর্মীয় স্বাধীনতা, শিক্ষার অধিকার, আইনের শাসন ইত্যাদি) নিশ্চিত করা হয়েছে। এগুলো নাগরিকদের স্বাধীনতা ও মর্যাদা রক্ষায় গুরুত্বপূর্ণ ভূমিকা পালন করে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n*   **সংসদীয় সরকার:** প্রধানমন্ত্রীকে সরকারপ্রধান করে সংসদীয় পদ্ধতি প্রবর্তন; রাষ্ট্রপতি আলঙ্কারিক প্রধান। এটি যুক্তরাজ্যের ওয়েস্টমিনস্টার মডেলের ওপর ভিত্তি করে গঠিত।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n*   **এককক্ষবিশিষ্ট সংসদ:** জাতীয় সংসদ এককক্ষবিশিষ্ট; ৩০০টি সরাসরি নির্বাচিত আসন। এটি সংসদীয় কার্যক্রমকে সহজ ও দ্রুততর করে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n*   **বিচার বিভাগের স্বাধীনতা:** বিচার বিভাগকে নির্বাহী বিভাগ থেকে পৃথক রাখার বিধান। এটি ন্যায়বিচার ও আইনের শাসন নিশ্চিত করতে সহায়ক।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n*   **দলীয় শৃঙ্খলা:** ৭০ অনুচ্ছেদে দলীয় শৃঙ্খলা রক্ষা বাধ্যতামূলক করা হয়েছে। এটি দলীয় একত্ব বজায় রাখতে সহায়ক, তবে সংসদে স্বাধীন চিন্তা ও মত প্রকাশের সুযোগ সীমিত করে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n*   **সংবিধানের প্রাধান্য:** সংবিধান সর্বোচ্চ আইন; এর বিরোধী কোনো আইন অবৈধ। এটি সংবিধানের মর্যাদা ও কর্তৃত্ব নিশ্চিত করে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n*   **রাষ্ট্র পরিচালনার মূলনীতি:** সংবিধানে রাষ্ট্র পরিচালনার মূলনীতি হিসেবে গণতন্ত্র, জাতীয়তাবাদ, সমাজতন্ত্র ও ধর্মনিরপেক্ষতা ঘোষিত হয়েছে। এগুলো বাংলাদেশের স্বাধীনতা সংগ্রামের আদর্শ ও চেতনাকে প্রতিফলিত করে।\n\n*   **সংশোধন প্রক্রিয়া:** সংবিধান সংশোধনের জন্য সংসদের দুই-তৃতীয়াংশ সদস্যের সমর্থন প্রয়োজন। এটি সংবিধানকে দুষ্পরিবর্তনীয় করে তোলে।\n\n**উপসংহার:**\n\n১৯৭২ সালের সংবিধান বাংলাদেশের গণতান্ত্রিক কাঠামো, মৌলিক অধিকার ও রাষ্ট্রীয় মূলনীতির ভিত্তি স্থাপন করে। বহুবার সংশোধিত হলেও এর মূল চেতনা আজও বাংলাদেশের রাষ্ট্রীয় পরিচয়ের অংশ। এটি বাংলাদেশের স্বাধীনতা সংগ্রামের আদর্শ ও চেতনাকে প্রতিফলিত করে এবং দেশের গণতান্ত্রিক কাঠামো, মৌলিক অধিকার ও রাষ্ট্রীয় মূলনীতির ভিত্তি স্থাপন করে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n* * *\n\n* * *\n\n**ভূমিকা:**\n\n১৯৭২ সালের সংবিধান হলো স্বাধীন ও সার্বভৌম বাংলাদেশের সর্বোচ্চ আইন। এটি ১৯৭২ সালের ৪ নভেম্বর গণপরিষদে গৃহীত এবং ১৬ ডিসেম্বর কার্যকর হয়। এটি বাংলাদেশের রাষ্ট্রীয় কাঠামো ও গণতান্ত্রিক মূল্যবোধের ভিত্তি।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n**মূল বিষয়বস্তু:**\n\n*   **লিখিত ও সংক্ষিপ্ত:** সংবিধানটি লিখিত দলিল; ১৫৩টি অনুচ্ছেদ, ১১টি ভাগ, ১টি প্রস্তাবনা ও ৪টি তফসিল সম্বলিত।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\\[[bn.wikipedia](https://bn.wikipedia.org/wiki/%E0%A6%AC%E0%A6%BE%E0%A6%82%E0%A6%B2%E0%A6%BE%E0%A6%A6%E0%A7%87%E0%A6%B6%E0%A7%87%E0%A6%B0_%E0%A6%B8%E0%A6%82%E0%A6%AC%E0%A6%BF%E0%A6%A7%E0%A6%BE%E0%A6%A8)\\]\\[[rkraihan](https://www.rkraihan.com/2023/01/bangladesher-songbidhaner-boisisto.html)\\]\n\n*   **প্রস্তাবনা:** জাতীয়তাবাদ, সমাজতন্ত্র, গণতন্ত্র ও ধর্মনিরপেক্ষতা—এই চারটি মূলনীতি রাষ্ট্র পরিচালনার ভিত্তি হিসেবে ঘোষিত।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\\[[prothomalo](https://www.prothomalo.com/politics/66uq4274ur)\\]\n\n*   **মৌলিক অধিকার:** অনুচ্ছেদ ২৭-৪৭ পর্যন্ত নাগরিকদের মৌলিক অধিকার (সমানতা, বাকস্বাধীনতা, ধর্মীয় স্বাধীনতা ইত্যাদি) নিশ্চিত করা হয়েছে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n*   **সংসদীয় সরকার:** প্রধানমন্ত্রীকে সরকারপ্রধান করে সংসদীয় পদ্ধতি প্রবর্তন; রাষ্ট্রপতি আলঙ্কারিক প্রধান।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\\[[bongotuner](https://bongotuner.com/songsodio-sorkar-kake-bole/)\\]\n\n*   **এককক্ষবিশিষ্ট সংসদ:** জাতীয় সংসদ এককক্ষবিশিষ্ট; ৩০০টি সরাসরি নির্বাচিত আসন।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n*   **বিচার বিভাগের স্বাধীনতা:** বিচার বিভাগকে নির্বাহী বিভাগ থেকে পৃথক রাখার বিধান।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n*   **দলীয় শৃঙ্খলা:** ৭০ অনুচ্ছেদে দলীয় শৃঙ্খলা রক্ষা বাধ্যতামূলক করা হয়েছে।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\\[[prothomalo](https://www.prothomalo.com/politics/66uq4274ur)\\]\n\n*   **সংবিধানের প্রাধান্য:** সংবিধান সর্বোচ্চ আইন; এর বিরোধী কোনো আইন অবৈধ।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\n\n**উপসংহার:**\n\n১৯৭২ সালের সংবিধান বাংলাদেশের গণতান্ত্রিক কাঠামো, মৌলিক অধিকার ও রাষ্ট্রীয় মূলনীতির ভিত্তি স্থাপন করে। বহুবার সংশোধিত হলেও এর মূল চেতনা আজও বাংলাদেশের রাষ্ট্রীয় পরিচয়ের অংশ।\\[[teachers.gov](https://teachers.gov.bd/index.php/blog/details/804955)\\]\\[[bdexample2.blogspot](https://bdexample2.blogspot.com/2023/01/Characteristics-of-the-Bangladesh-Constitution-of-1972.html)\\]"
          },

                    "q": "সংসদীয় সরকার কী?",
                    "a": "**ভূমিকা:**\n\nসংসদীয় সরকার হলো এমন একটি শাসনব্যবস্থা যেখানে শাসন বিভাগ (মন্ত্রিপরিষদ) আইন বিভাগের (সংসদ) নিকট দায়ী থাকে এবং সংসদের সংখ্যাগরিষ্ঠ দল বা জোট সরকার গঠন করে। বাংলাদেশসহ যুক্তরাজ্য, ভারত, কানাডা প্রভৃতি দেশে এ ব্যবস্থা চালু আছে। এটি গণতান্ত্রিক শাসনব্যবস্থার একটি কার্যকর মডেল, যেখানে জনপ্রতিনিধিদের মাধ্যমে সরকার গঠিত হয় এবং মন্ত্রিপরিষদ সংসদের নিকট দায়ী থাকে।\\[[sattacademy](https://sattacademy.com/academy/%E0%A6%B8%E0%A6%82%E0%A6%B8%E0%A6%A6%E0%A7%80%E0%A7%9F-%E0%A6%B8%E0%A6%B0%E0%A6%95%E0%A6%BE%E0%A6%B0-47209)\\]\n\n**মূল বিষয়বস্তু:**\n\n*   **সংজ্ঞা:** যে সরকারব্যবস্থায় মন্ত্রিপরিষদ সংসদের ওপর নির্ভরশীল এবং সংসদের বিশ্বাস হারালে পদত্যাগ করে, তাকে সংসদীয় সরকার বলে। এটি যুক্তরাজ্যের ওয়েস্টমিনস্টার মডেলের ওপর ভিত্তি করে গঠিত।\\[[sattacademy](https://sattacademy.com/academy/%E0%A6%B8%E0%A6%82%E0%A6%B8%E0%A6%A6%E0%A7%80%E0%A7%9F-%E0%A6%B8%E0%A6%B0%E0%A6%95%E0%A6%BE%E0%A6%B0-47209)\\]\n\n*   **মূল বৈশিষ্ট্য:**\n    \n    *   _দ্বৈত নেতৃত্ব:_ রাষ্ট্রপ্রধান (রাষ্ট্রপতি/রাজা) আলঙ্কারিক; সরকারপ্রধান (প্রধানমন্ত্রী) প্রকৃত ক্ষমতার অধিকারী। রাষ্ট্রপ্রধানের ভূমিকা মূলত আনুষ্ঠানিক ও প্রতীকী।\n    \n    *   _মন্ত্রিপরিষদের দায়িত্বশীলতা:_ মন্ত্রিপরিষদ সংসদের নিকট যৌথভাবে দায়ী। সংসদে অনাস্থা প্রস্তাব পাস হলে মন্ত্রিপরিষদ পদত্যাগ করে।\n    \n    *   _সংসদের সংখ্যাগরিষ্ঠতা:_ সংসদে সংখ্যাগরিষ্ঠ দল বা জোটের নেতাকে প্রধানমন্ত্রী নিয়োগ করা হয়।\n    \n    *   _অবিচ্ছেদ্য সম্পর্ক:_ শাসন ও আইন বিভাগের মধ্যে ঘনিষ্ঠ সম্পর্ক; মন্ত্রীরা সংসদ সদস্য হতে হয়। এটি শাসন ও আইন বিভাগের মধ্যে সমন্বয় নিশ্চিত করে।\n    \n    *   _প্রধানমন্ত্রীর ক্ষমতা:_ প্রধানমন্ত্রী মন্ত্রিপরিষদ গঠন করেন, মন্ত্রীদের দায়িত্ব বণ্টন করেন এবং সরকারি নীতি নির্ধারণে মূল ভূমিকা পালন করেন।\n\n*   **বাংলাদেশের প্রেক্ষিত:** ১৯৭২ সালের সংবিধানে সংসদীয় ব্যবস্থা প্রবর্তিত হয়; ১৯৭৫-১৯৯১ সময়কালে রাষ্ট্রপতিশাসিত ব্যবস্থা ছিল; ১৯৯১ সাল থেকে পুনরায় সংসদীয় ব্যবস্থা চালু। বর্তমানে বাংলাদেশে সংসদীয় সরকার ব্যবস্থা প্রচলিত আছে।\n\n*   **সুবিধা:**\n    \n    *   সরকার সংসদের নিকট দায়ী থাকে, যা গণতান্ত্রিক জবাবদিহিতা নিশ্চিত করে।\n    \n    *   সংসদে অনাস্থা প্রস্তাবের মাধ্যমে সরকার পরিবর্তন করা যায়, যা গণতান্ত্রিক স্থায়িত্ব নিশ্চিত করে।\n    \n    *   শাসন ও আইন বিভাগের মধ্যে সমন্বয় নিশ্চিত হয়।\n\n*   **সীমাবদ্ধতা:**\n    \n    *   সংসদে সংখ্যাগরিষ্ঠ দলের ওপর অত্যধিক নির্ভরশীলতা সরকারকে সংসদের নিয়ন্ত্রণের বাইরে নিয়ে যেতে পারে।\n    \n    *   দলীয় শৃঙ্খলার কারণে সংসদে স্বাধীন চিন্তা ও মত প্রকাশের সুযোগ সীমিত হয়।\n\n**উপসংহার:**\n\nসংসদীয় সরকার গণতান্ত্রিক শাসনব্যবস্থার একটি কার্যকর মডেল, যেখানে জনপ্রতিনিধিদের মাধ্যমে সরকার গঠিত হয় এবং মন্ত্রিপরিষদ সংসদের নিকট দায়ী থাকে। বাংলাদেশে এ ব্যবস্থা গণতন্ত্রের স্থায়িত্ব ও জবাবদিহিতা নিশ্চিত করে। তবে দলীয় শৃঙ্খলা ও সংসদে সংখ্যাগরিষ্ঠ দলের ওপর অত্যধিক নির্ভরশীলতা মাঝেমধ্যে গণতান্ত্রিক প্রক্রিয়াকে বাধাগ্রস্ত করে।\n\n* * *\n\n* * *\n\n**ভূমিকা:**\n\nসংসদীয় সরকার হলো এমন একটি শাসনব্যবস্থা যেখানে শাসন বিভাগ (মন্ত্রিপরিষদ) আইন বিভাগের (সংসদ) নিকট দায়ী থাকে এবং সংসদের সংখ্যাগরিষ্ঠ দল বা জোট সরকার গঠন করে। বাংলাদেশসহ যুক্তরাজ্য, ভারত, কানাডা প্রভৃতি দেশে এ ব্যবস্থা চালু আছে।\\[[bongotuner](https://bongotuner.com/songsodio-sorkar-kake-bole/)\\]\\[[sattacademy](https://sattacademy.com/academy/%E0%A6%B8%E0%A6%82%E0%A6%B8%E0%A6%A6%E0%A7%80%E0%A7%9F-%E0%A6%B8%E0%A6%B0%E0%A6%95%E0%A6%BE%E0%A6%B0-47209)\\]\\[[teachers.gov](https://teachers.gov.bd/shared/contents/2020/May/4/presentation/file_512902_1588579131.pptx)\\]\n\n**মূল বিষয়বস্তু:**\n\n*   **সংজ্ঞা:** যে সরকারব্যবস্থায় মন্ত্রিপরিষদ সংসদের ওপর নির্ভরশীল এবং সংসদের বিশ্বাস হারালে পদত্যাগ করে, তাকে সংসদীয় সরকার বলে।\\[[bongotuner](https://bongotuner.com/songsodio-sorkar-kake-bole/)\\]\\[[sattacademy](https://sattacademy.com/academy/%E0%A6%B8%E0%A6%82%E0%A6%B8%E0%A6%A6%E0%A7%80%E0%A7%9F-%E0%A6%B8%E0%A6%B0%E0%A6%95%E0%A6%BE%E0%A6%B0-47209)\\]\\[[readaim](https://readaim.com/%E0%A7%A7%E0%A7%AF%E0%A7%AD%E0%A7%A8-%E0%A6%B8%E0%A6%82%E0%A6%AC%E0%A6%BF%E0%A6%A7%E0%A6%BE%E0%A6%A8%E0%A7%87%E0%A6%B0-%E0%A6%AC%E0%A7%88%E0%A6%B6%E0%A6%BF%E0%A6%B7%E0%A7%8D%E0%A6%9F%E0%A7%8D-2/)\\]\n\n*   **মূল বৈশিষ্ট্য:**\n    \n    *   _দ্বৈত নেতৃত্ব:_ রাষ্ট্রপ্রধান (রাষ্ট্রপতি/রাজা) আলঙ্কারিক; সরকারপ্রধান (প্রধানমন্ত্রী) প্রকৃত ক্ষমতার অধিকারী।\n    \n    *   _মন্ত্রিপরিষদের দায়িত্বশীলতা:_ মন্ত্রিপরিষদ সংসদের নিকট যৌথভাবে দায়ী।\n    \n    *   _সংসদের সংখ্যাগরিষ্ঠতা:_ সংসদে সংখ্যাগরিষ্ঠ দল বা জোটের নেতাকে প্রধানমন্ত্রী নিয়োগ করা হয়।\n    \n    *   _অবিচ্ছেদ্য সম্পর্ক:_ শাসন ও আইন বিভাগের মধ্যে ঘনিষ্ঠ সম্পর্ক; মন্ত্রীরা সংসদ সদস্য হতে হয়।\\[[bongotuner](https://bongotuner.com/songsodio-sorkar-kake-bole/)\\]\\[[teachers.gov](https://teachers.gov.bd/shared/contents/2020/May/4/presentation/file_512902_1588579131.pptx)\\]\n\n*   **বাংলাদেশের প্রেক্ষিত:** ১৯৭২ সালের সংবিধানে সংসদীয় ব্যবস্থা প্রবর্তিত হয়; ১৯৭৫-১৯৯১ সময়কালে রাষ্ট্রপতিশাসিত ব্যবস্থা ছিল; ১৯৯১ সাল থেকে পুনরায় সংসদীয় ব্যবস্থা চালু।\\[[teachers.gov](https://teachers.gov.bd/shared/contents/2020/May/4/presentation/file_512902_1588579131.pptx)\\]\\[[readaim](https://readaim.com/%E0%A7%A7%E0%A7%AF%E0%A7%AD%E0%A7%A8-%E0%A6%B8%E0%A6%82%E0%A6%AC%E0%A6%BF%E0%A6%A7%E0%A6%BE%E0%A6%A8%E0%A7%87%E0%A6%B0-%E0%A6%AC%E0%A7%88%E0%A6%B6%E0%A6%BF%E0%A6%B7%E0%A7%8D%E0%A6%9F%E0%A7%8D-2/)\\]\n\n**উপসংহার:**\n\nসংসদীয় সরকার গণতান্ত্রিক শাসনব্যবস্থার একটি কার্যকর মডেল, যেখানে জনপ্রতিনিধিদের মাধ্যমে সরকার গঠিত হয় এবং মন্ত্রিপরিষদ সংসদের নিকট দায়ী থাকে। বাংলাদেশে এ ব্যবস্থা গণতন্ত্রের স্থায়িত্ব ও জবাবদিহিতা নিশ্চিত করে।\\[[teachers.gov](https://teachers.gov.bd/shared/contents/2020/May/4/presentation/file_512902_1588579131.pptx)\\]\\[[readaim](https://readaim.com/%E0%A7%A7%E0%A7%AF%E0%A7%AD%E0%A7%A8-%E0%A6%B8%E0%A6%82%E0%A6%AC%E0%A6%BF%E0%A6%A7%E0%A6%BE%E0%A6%A8%E0%A7%87%E0%A6%B0-%E0%A6%AC%E0%A7%88%E0%A6%B6%E0%A6%BF%E0%A6%B7%E0%A7%8D%E0%A6%9F%E0%A7%8D-2/)\\]"

                    "q": "বেসামরিকরণ প্রক্রিয়া আলোচনা কর।",
                    "a": "**ভূমিকা:**\n\nবেসামরিকরণ প্রক্রিয়া হলো এমন একটি রাজনৈতিক ও সাংবিধানিক ব্যবস্থা যেখানে রাষ্ট্রের সর্বোচ্চ ক্ষমতা সামরিক বাহিনীর হাতে না থেকে নির্বাচিত বেসামরিক নেতৃত্বের হাতে থাকে। বাংলাদেশের ইতিহাসে এ প্রক্রিয়া গণতন্ত্রের স্থায়িত্বের জন্য অত্যন্ত গুরুত্বপূর্ণ। ১৯৭৫-১৯৯০ সময়কালে বাংলাদেশে সামরিক শাসন চালু ছিল, যা ১৯৯০ সালের গণঅভ্যুত্থানের মাধ্যমে অবসান ঘটে এবং ১৯৯১ সালে সংসদীয় গণতন্ত্র পুনঃপ্রবর্তিত হয়।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n**মূল বিষয়বস্তু:**\n\n*   **সংজ্ঞা:** বেসামরিকরণ মানে হলো সামরিক শাসনের অবসান ঘটিয়ে গণতান্ত্রিকভাবে নির্বাচিত বেসামরিক সরকার প্রতিষ্ঠা ও শক্তিশালী করা। এটি গণতন্ত্রের স্থায়িত্ব ও সংবিধানের শাসন নিশ্চিত করতে অপরিহার্য।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n*   **বাংলাদেশের প্রেক্ষিত:**\n    \n    *   ১৯৭৫-১৯৯০ সময়কালে বাংলাদেশে সামরিক শাসন (জিয়াউর রহমান, এরশাদ) চালু ছিল। এ সময় সংবিধান স্থগিত করা হয়, রাজনৈতিক দল নিষিদ্ধ করা হয় এবং সামরিক আইন জারি করা হয়।\n    \n    *   ১৯৯০ সালের গণঅভ্যুত্থানের মাধ্যমে সামরিক শাসনের অবসান ঘটে এবং ১৯৯১ সালে সংসদীয় গণতন্ত্র পুনঃপ্রবর্তিত হয়।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n*   **প্রক্রিয়ার উপাদান:**\n    \n    *   _সামরিক বাহিনীর রাজনীতি থেকে দূরে রাখা:_ সংবিধানে সামরিক বাহিনীর রাজনৈতিক কার্যক্রম নিষিদ্ধ করা। এটি সামরিক বাহিনীকে রাজনীতির বাইরে রাখতে সহায়ক।\n    \n    *   _নির্বাচিত সরকার:_ নিয়মিত, সুষ্ঠু ও গ্রহণযোগ্য নির্বাচনের মাধ্যমে বেসামরিক সরকার গঠন। এটি গণতান্ত্রিক জবাবদিহিতা নিশ্চিত করে।\n    \n    *   _প্রাতিষ্ঠানিক সংস্কার:_ নির্বাচন কমিশন, বিচার বিভাগ ও সংসদের স্বাধীনতা নিশ্চিত করা। এটি গণতান্ত্রিক প্রক্রিয়াকে শক্তিশালী করে।\n    \n    *   _নাগরিক সমাজের ভূমিকা:_ গণমাধ্যম, শিক্ষা প্রতিষ্ঠান ও এনজিওগুলোর মাধ্যমে গণতান্ত্রিক চর্চা জোরদার করা। এটি নাগরিকদের গণতান্ত্রিক চেতনা জাগ্রত করে।\n\n*   **চ্যালেঞ্জ:** সামরিক বাহিনীর প্রভাব, রাজনৈতিক অস্থিরতা, নির্বাচন নিয়ে বিতর্ক বেসামরিকরণ প্রক্রিয়াকে বাধাগ্রস্ত করতে পারে। বাংলাদেশে মাঝেমধ্যে সামরিক বাহিনীর রাজনৈতিক হস্তক্ষেপের আশঙ্কা দেখা দেয়, যা গণতন্ত্রের স্থায়িত্বকে হুমকির মুখে ফেলে।\n\n*   **আন্তর্জাতিক প্রেক্ষিত:** বিশ্বের অনেক দেশে (যেমন: পাকিস্তান, মিয়ানমার, থাইল্যান্ড) সামরিক শাসন ও বেসামরিকরণ প্রক্রিয়া দেখা গেছে। সফল বেসামরিকরণের জন্য প্রাতিষ্ঠানিক সংস্কার, নাগরিক সচেতনতা ও আন্তর্জাতিক সহযোগিতা প্রয়োজন।\n\n**উপসংহার:**\n\nবেসামরিকরণ প্রক্রিয়া বাংলাদেশে গণতন্ত্রের স্থায়িত্ব ও সংবিধানের শাসন নিশ্চিত করতে অপরিহার্য। ১৯৯১ সাল থেকে এ প্রক্রিয়া অব্যাহত থাকলেও নিয়মিত সংস্কার ও নাগরিক সচেতনতার মাধ্যমে এটি আরও শক্তিশালী করা প্রয়োজন। সামরিক বাহিনীকে রাজনীতির বাইরে রাখা, নির্বাচন কমিশন ও বিচার বিভাগের স্বাধীনতা নিশ্চিত করা এবং নাগরিক সমাজের সক্রিয় অংশগ্রহণ বেসামরিকরণ প্রক্রিয়াকে সফল করতে সহায়ক হবে।\\[[jamaat-e-islami](https://www.jamaat-e-islami.org/news-details.php?category=5&news=17848)\\]\n\n* * *\n\n* * *\n\n**ভূমিকা:**\n\nবেসামরিকরণ প্রক্রিয়া হলো এমন একটি রাজনৈতিক ও সাংবিধানিক ব্যবস্থা যেখানে রাষ্ট্রের সর্বোচ্চ ক্ষমতা সামরিক বাহিনীর হাতে না থেকে নির্বাচিত বেসামরিক নেতৃত্বের হাতে থাকে। বাংলাদেশের ইতিহাসে এ প্রক্রিয়া গণতন্ত্রের স্থায়িত্বের জন্য অত্যন্ত গুরুত্বপূর্ণ।\\[[banglastream](https://banglastream.net/op-ed/column/bshmoresyrap)\\]\n\n**মূল বিষয়বস্তু:**\n\n*   **সংজ্ঞা:** বেসামরিকরণ মানে হলো সামরিক শাসনের অবসান ঘটিয়ে গণতান্ত্রিকভাবে নির্বাচিত বেসামরিক সরকার প্রতিষ্ঠা ও শক্তিশালী করা।\\[[banglastream](https://banglastream.net/op-ed/column/bshmoresyrap)\\]\n\n*   **বাংলাদেশের প্রেক্ষিত:**\n    \n    *   ১৯৭৫-১৯৯০ সময়কালে বাংলাদেশে সামরিক শাসন (জিয়াউর রহমান, এরশাদ) চালু ছিল।\n    \n    *   ১৯৯০ সালের গণঅভ্যুত্থানের মাধ্যমে সামরিক শাসনের অবসান ঘটে এবং ১৯৯১ সালে সংসদীয় গণতন্ত্র পুনঃপ্রবর্তিত হয়।\\[[banglastream](https://banglastream.net/op-ed/column/bshmoresyrap)\\]\n\n*   **প্রক্রিয়ার উপাদান:**\n    \n    *   _সামরিক বাহিনীর রাজনীতি থেকে দূরে রাখা:_ সংবিধানে সামরিক বাহিনীর রাজনৈতিক কার্যক্রম নিষিদ্ধ করা।\n    \n    *   _নির্বাচিত সরকার:_ নিয়মিত, সুষ্ঠু ও গ্রহণযোগ্য নির্বাচনের মাধ্যমে বেসামরিক সরকার গঠন।\n    \n    *   _প্রাতিষ্ঠানিক সংস্কার:_ নির্বাচন কমিশন, বিচার বিভাগ ও সংসদের স্বাধীনতা নিশ্চিত করা।\n    \n    *   _নাগরিক সমাজের ভূমিকা:_ গণমাধ্যম, শিক্ষা প্রতিষ্ঠান ও এনজিওগুলোর মাধ্যমে গণতান্ত্রিক চর্চা জোরদার করা।\n\n*   **চ্যালেঞ্জ:** সামরিক বাহিনীর প্রভাব, রাজনৈতিক অস্থিরতা, নির্বাচন নিয়ে বিতর্ক বেসামরিকরণ প্রক্রিয়াকে বাধাগ্রস্ত করতে পারে।\n\n**উপসংহার:**\n\nবেসামরিকরণ প্রক্রিয়া বাংলাদেশে গণতন্ত্রের স্থায়িত্ব ও সংবিধানের শাসন নিশ্চিত করতে অপরিহার্য। ১৯৯১ সাল থেকে এ প্রক্রিয়া অব্যাহত থাকলেও নিয়মিত সংস্কার ও নাগরিক সচেতনতার মাধ্যমে এটি আরও শক্তিশালী করা প্রয়োজন।\\[[banglastream](https://banglastream.net/op-ed/column/bshmoresyrap)\\]"
          }
];

            div.innerHTML = `
                <div class="h-px bg-slate-300 dark:bg-slate-700 flex-grow"></div>
                <h3 class="px-4 text-xl font-bold text-slate-800 dark:text-slate-200 bg-transparent font-['Hind_Siliguri']">${title}</h3>
                <div class="h-px bg-slate-300 dark:bg-slate-700 flex-grow"></div>
            `;
            return div;
        }

        function createQACard(question, answer, bgClass) {
            const card = document.createElement('div');
            card.className = `qa-card ${bgClass} p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm font-['Hind_Siliguri']`;
            card.innerHTML = `
                <h4 class="font-semibold text-slate-800 dark:text-slate-200 mb-2">${question}</h4>
                <div class="text-slate-600 dark:text-slate-400 text-sm md:text-base leading-relaxed">
                    <span class="font-bold text-blue-600 dark:text-blue-400 mr-1 text-sm">উত্তর:</span> 
                    ${answer}
                </div>
            `;
            return card;
        }

        function createClickableQACard(question, answer) {
            const card = document.createElement('button');
            card.className = `w-full bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden text-left p-5 hover:bg-blue-50 dark:hover:bg-slate-700 hover:border-blue-300 dark:hover:border-blue-500 transition-all focus:outline-none group font-['Hind_Siliguri']`;
            card.innerHTML = `
                <div class="flex items-start justify-between gap-4">
                    <h4 class="text-lg font-bold text-slate-800 dark:text-slate-200 group-hover:text-blue-700 dark:group-hover:text-blue-400 transition-colors">${question}</h4>
                    <span class="text-blue-500 dark:text-blue-400 mt-1 shrink-0 bg-blue-50 dark:bg-blue-900/30 p-1.5 rounded-full group-hover:bg-blue-600 dark:group-hover:bg-blue-500 group-hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </span>
                </div>
            `;
            card.addEventListener('click', () => showSingleAnswer(question, answer));
            return card;
        }

        function doShowSingleAnswer(question, answer) {
            questionsView.classList.add('hidden');
            document.getElementById('single-question-title').textContent = question;
            document.getElementById('single-answer-content').innerHTML = marked.parse(answer);
            singleAnswerView.classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function doBackToQuestions() {
            singleAnswerView.classList.add('hidden');
            questionsView.classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const themeToggleBtn = document.getElementById('theme-toggle');

        if (document.documentElement.classList.contains('dark')) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });
    
        // --- HTML5 History API Integration ---

        // Initialize history state on load
        if (!history.state) {
            history.replaceState({ view: 'main' }, '', '');
        }

        function openExam(examType) {
            history.pushState({ view: 'subjects', examType }, '', '');
            doOpenExam(examType);
        }

        function backToMain() {
            if (history.state && history.state.view !== 'main') {
                history.back();
            } else {
                doBackToMain();
            }
        }

        function openSubject(id, title) {
            // Include examType in the state since renderQuestions depends on currentExamType
            history.pushState({ view: 'questions', subjectId: id, title, examType: currentExamType }, '', '');
            doOpenSubject(id, title);
        }

        function backToSubjects() {
            history.back();
        }

        function showSingleAnswer(question, answer) {
            history.pushState({ view: 'answer', question, answer, examType: currentExamType, subjectId: currentSubjectId }, '', '');
            doShowSingleAnswer(question, answer);
        }

        function backToQuestions() {
            history.back();
        }

        window.addEventListener('popstate', (event) => {
            const state = event.state;
            if (!state) return;

            // Prevent views from overlapping when navigating backwards
            subjectsView.classList.add('hidden');
            questionsView.classList.add('hidden');
            singleAnswerView.classList.add('hidden');

            if (state.view === 'main') {
                doBackToMain();
            } else if (state.view === 'subjects') {
                doOpenExam(state.examType);
            } else if (state.view === 'questions') {
                // Ensure currentExamType is set correctly in case of direct refresh/navigation
                currentExamType = state.examType; 
                doOpenSubject(state.subjectId, state.title);
            } else if (state.view === 'answer') {
                currentExamType = state.examType;
                currentSubjectId = state.subjectId;
                doShowSingleAnswer(state.question, state.answer);
            }
        });

    </script>
</body>
</html>
