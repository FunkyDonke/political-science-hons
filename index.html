                    "q": "১৬। বিশ্ব অর্থনীতিতে নয়া আন্তর্জাতিক অর্থ ব্যবস্থার কার্যকারিতা আলোচনা কর।",
                    "a": "## ভূমিকা\n\nনয়া আন্তর্জাতিক অর্থব্যবস্থা বা New International Economic Order (NIEO) হলো এমন একটি আন্তর্জাতিক অর্থনৈতিক কাঠামোর দাবি, যেখানে উন্নত ও উন্নয়নশীল রাষ্ট্রের মধ্যে বিদ্যমান বৈষম্য কমবে এবং উন্নয়নশীল দেশগুলো ন্যায়সঙ্গত অর্থনৈতিক অধিকার লাভ করবে। ঔপনিবেশিক শোষণ, অসম বাণিজ্য, প্রযুক্তিগত নির্ভরতা ও বৈদেশিক ঋণের সমস্যা মোকাবিলাই এর মূল লক্ষ্য।\n\n## নয়া আন্তর্জাতিক অর্থব্যবস্থার উদ্দেশ্য\n\n### ১. অর্থনৈতিক বৈষম্য দূরীকরণ\n\nউন্নত ও উন্নয়নশীল রাষ্ট্রের মধ্যে সম্পদ, আয় ও প্রযুক্তির ব্যবধান কমানো এর প্রধান উদ্দেশ্য।\n\n### ২. ন্যায্য বাণিজ্যব্যবস্থা\n\nউন্নয়নশীল দেশগুলোর পণ্য যাতে ন্যায্য মূল্য পায় এবং উন্নত দেশগুলো সংরক্ষণবাদী নীতি কমায়, সে দাবি NIEO সমর্থন করে।\n\n### ৩. প্রাকৃতিক সম্পদের ওপর সার্বভৌমত্ব\n\nপ্রতিটি রাষ্ট্রের নিজস্ব প্রাকৃতিক সম্পদ ব্যবহার ও নিয়ন্ত্রণের অধিকার নিশ্চিত করা এর গুরুত্বপূর্ণ দিক।\n\n### ৪. উন্নয়ন সহায়তা বৃদ্ধি\n\nউন্নত রাষ্ট্রগুলো থেকে উন্নয়নশীল রাষ্ট্রে ঋণ, অনুদান ও প্রযুক্তি সহায়তা বাড়ানোর দাবি রয়েছে।\n\n### ৫. প্রযুক্তি হস্তান্তর\n\nউন্নয়নশীল দেশগুলোকে আধুনিক প্রযুক্তি সহজ শর্তে সরবরাহ করা হলে উৎপাদনশীলতা ও শিল্পায়ন বৃদ্ধি পাবে।\n\n### ৬. ঋণের বোঝা হ্রাস\n\nঅতিরিক্ত সুদ ও কঠোর শর্তের ঋণ উন্নয়নশীল দেশগুলোর অর্থনীতিকে দুর্বল করে। তাই ঋণ পুনর্গঠন, সুদ কমানো ও ঋণ মওকুফের দাবি করা হয়।\n\n### ৭. বহুজাতিক কোম্পানির নিয়ন্ত্রণ\n\nবহুজাতিক কোম্পানির একচেটিয়া প্রভাব ও মুনাফা পাচার নিয়ন্ত্রণ করে জাতীয় অর্থনীতির স্বার্থ রক্ষা করা প্রয়োজন।\n\n### ৮. আন্তর্জাতিক অর্থনৈতিক প্রতিষ্ঠানে অংশগ্রহণ\n\nবিশ্বব্যাংক, আন্তর্জাতিক মুদ্রা তহবিল ও বিশ্ববাণিজ্য সংস্থায় উন্নয়নশীল রাষ্ট্রের প্রতিনিধিত্ব ও ভোটাধিকার বাড়ানোর দাবি NIEO-এর অন্তর্ভুক্ত।\n\n## কার্যকারিতা\n\n### ১. উন্নয়ন প্রশ্নকে আন্তর্জাতিক আলোচনায় আনা\n\nNIEO উন্নয়নশীল দেশগুলোর অর্থনৈতিক সমস্যা ও বৈষম্যকে আন্তর্জাতিক রাজনীতির গুরুত্বপূর্ণ ইস্যুতে পরিণত করেছে।\n\n### ২. দক্ষিণ-দক্ষিণ সহযোগিতা\n\nউন্নয়নশীল রাষ্ট্রগুলোর মধ্যে বাণিজ্য, প্রযুক্তি ও রাজনৈতিক সহযোগিতা বৃদ্ধিতে এটি উৎসাহ দিয়েছে।\n\n### ৩. সম্পদের ওপর অধিকার প্রতিষ্ঠা\n\nপ্রাকৃতিক সম্পদের জাতীয় নিয়ন্ত্রণ ও অর্থনৈতিক সার্বভৌমত্বের ধারণা শক্তিশালী হয়েছে।\n\n### ৪. উন্নয়ন সহায়তার গুরুত্ব বৃদ্ধি\n\nআন্তর্জাতিক উন্নয়ন নীতি, দারিদ্র্য বিমোচন ও প্রযুক্তি সহায়তার বিষয়গুলো গুরুত্ব পেয়েছে।\n\n## সীমাবদ্ধতা\n\n### ১. উন্নত রাষ্ট্রের বিরোধিতা\n\nউন্নত দেশগুলো নিজেদের অর্থনৈতিক সুবিধা কমাতে অনিচ্ছুক হওয়ায় NIEO-এর অনেক প্রস্তাব বাস্তবায়িত হয়নি।\n\n### ২. উন্নয়নশীল রাষ্ট্রের অভ্যন্তরীণ দুর্বলতা\n\nদুর্নীতি, রাজনৈতিক অস্থিরতা, দুর্বল প্রতিষ্ঠান ও অদক্ষ অর্থনীতি উন্নয়ন বাধাগ্রস্ত করে।\n\n### ৩. বিশ্বায়নের অসম সুফল\n\nমুক্তবাজার ও বিশ্বায়ন অনেক ক্ষেত্রে উন্নয়নশীল দেশকে প্রতিযোগিতায় পিছিয়ে দিয়েছে।\n\n### ৪. বাস্তবায়নকারী প্রতিষ্ঠানের অভাব\n\nNIEO বাস্তবায়নের জন্য শক্তিশালী বাধ্যতামূলক আন্তর্জাতিক কাঠামো গড়ে ওঠেনি।\n\n## উপসংহার\n\nনয়া আন্তর্জাতিক অর্থব্যবস্থা পুরোপুরি বাস্তবায়িত না হলেও এটি বৈশ্বিক অর্থনৈতিক ন্যায়বিচারের একটি গুরুত্বপূর্ণ ধারণা। এটি উন্নয়নশীল রাষ্ট্রের অধিকার, ন্যায্য বাণিজ্য, প্রযুক্তি হস্তান্তর ও অর্থনৈতিক সার্বভৌমত্বের প্রশ্নকে সামনে এনেছে। ভবিষ্যতে বৈশ্বিক বৈষম্য কমাতে NIEO-এর নীতিগুলো আরও কার্যকরভাবে বাস্তবায়ন করা প্রয়োজন।"

                    "q": "১৭। 'উগ্র জাতীয়তাবাদ আন্তর্জাতিকতার প্রতি হুমকিস্বরূপ'-ব্যাখ্যা কর।",
                    "a": "## ভূমিকা\n\nজাতীয়তাবাদ হলো নিজ জাতি, দেশ ও রাষ্ট্রের প্রতি আনুগত্য ও ভালোবাসার অনুভূতি। মধ্যপন্থী জাতীয়তাবাদ রাষ্ট্রীয় ঐক্য ও উন্নয়নে সহায়ক। কিন্তু যখন জাতীয় স্বার্থকে অন্য সব মূল্যবোধের ঊর্ধ্বে স্থাপন করা হয় এবং অন্য জাতি ও রাষ্ট্রকে শত্রু হিসেবে দেখা হয়, তখন তা উগ্র জাতীয়তাবাদে পরিণত হয়। আন্তর্জাতিকতা হলো রাষ্ট্র ও জনগণের মধ্যে সহযোগিতা, শান্তি, পারস্পরিক নির্ভরতা ও মানবিক সংহতির ধারণা। উগ্র জাতীয়তাবাদ এই নীতিগুলোর বিরোধী।\n\n## উগ্র জাতীয়তাবাদ কীভাবে হুমকি সৃষ্টি করে\n\n### ১. অন্য জাতির প্রতি বিদ্বেষ\n\nউগ্র জাতীয়তাবাদ নিজের জাতিকে শ্রেষ্ঠ এবং অন্য জাতিকে নিকৃষ্ট মনে করে। এর ফলে জাতিগত ঘৃণা ও বৈরিতা সৃষ্টি হয়।\n\n### ২. আগ্রাসী পররাষ্ট্রনীতি\n\nউগ্র জাতীয়তাবাদী রাষ্ট্র জাতীয় মর্যাদা বৃদ্ধির নামে অন্য রাষ্ট্রের ভূখণ্ড দখল, হস্তক্ষেপ বা সামরিক আগ্রাসন চালাতে পারে।\n\n### ৩. সাম্রাজ্যবাদকে উৎসাহ\n\nনিজ জাতির শ্রেষ্ঠত্ব প্রমাণের আকাঙ্ক্ষা উপনিবেশ স্থাপন ও অন্য জনগোষ্ঠীর ওপর আধিপত্য বিস্তারের প্রবণতা তৈরি করে।\n\n### ৪. যুদ্ধের সম্ভাবনা বৃদ্ধি\n\nজাতীয় সম্মান, সীমান্ত ও প্রতীকী ইস্যুতে আপস না করার কারণে ছোট বিরোধও যুদ্ধের রূপ নিতে পারে।\n\n### ৫. অস্ত্র প্রতিযোগিতা\n\nউগ্র জাতীয়তাবাদী সরকার নিরাপত্তা ও মর্যাদার নামে সামরিক ব্যয় বাড়ায়। এতে প্রতিবেশী রাষ্ট্রও অস্ত্র সংগ্রহে বাধ্য হয়।\n\n### ৬. আন্তর্জাতিক আইন অমান্য\n\nউগ্র জাতীয়তাবাদীরা মনে করতে পারে যে জাতীয় স্বার্থের প্রয়োজনে আন্তর্জাতিক আইন অমান্য করা বৈধ। এতে আন্তর্জাতিক শৃঙ্খলা দুর্বল হয়।\n\n### ৭. বহুপাক্ষিক সহযোগিতা বাধাগ্রস্ত\n\nজলবায়ু পরিবর্তন, মহামারি, সন্ত্রাসবাদ ও অর্থনৈতিক সংকট কোনো একক রাষ্ট্র সমাধান করতে পারে না। কিন্তু উগ্র জাতীয়তাবাদ যৌথ উদ্যোগকে দুর্বল করে।\n\n### ৮. আন্তর্জাতিক সংস্থার কার্যকারিতা কমানো\n\nউগ্র জাতীয়তাবাদী রাষ্ট্র আন্তর্জাতিক সংগঠনের সিদ্ধান্তকে জাতীয় সার্বভৌমত্বের ওপর হস্তক্ষেপ হিসেবে বিবেচনা করতে পারে।\n\n### ৯. মানবাধিকারের অবমূল্যায়ন\n\nজাতীয় নিরাপত্তার অজুহাতে সংখ্যালঘু, অভিবাসী ও শরণার্থীদের অধিকার হরণ করা হতে পারে।\n\n### ১০. অভিবাসীবিরোধী মনোভাব\n\nউগ্র জাতীয়তাবাদ বিদেশি নাগরিক ও অভিবাসীদের অর্থনৈতিক ও সাংস্কৃতিক হুমকি হিসেবে উপস্থাপন করে।\n\n### ১১. বিশ্বজনীন মানবিকতার বিরোধিতা\n\nআন্তর্জাতিকতা মানুষকে জাতি, ধর্ম ও রাষ্ট্রের সীমার বাইরে মানবিক মর্যাদায় দেখার শিক্ষা দেয়। উগ্র জাতীয়তাবাদ এই সার্বজনীনতার পরিবর্তে সংকীর্ণ পরিচয়কে অগ্রাধিকার দেয়।\n\n### ১২. বৈশ্বিক সমস্যার সমাধানে বাধা\n\nজলবায়ু, মহামারি, খাদ্য ও সাইবার নিরাপত্তার মতো সমস্যা মোকাবিলায় তথ্য ও সম্পদ ভাগাভাগি প্রয়োজন। উগ্র জাতীয়তাবাদ এ সহযোগিতাকে সীমিত করে।\n\n## জাতীয়তাবাদ ও আন্তর্জাতিকতার সমন্বয়\n\n### ১. মধ্যপন্থী জাতীয়তাবাদ\n\nদেশপ্রেম ও জাতীয় উন্নয়ন আন্তর্জাতিক সহযোগিতার সঙ্গে সামঞ্জস্যপূর্ণ হতে পারে।\n\n### ২. জাতীয় স্বার্থের দায়িত্বশীল ব্যাখ্যা\n\nজাতীয় স্বার্থকে এমনভাবে নির্ধারণ করতে হবে, যাতে অন্য রাষ্ট্রের অধিকার ও আন্তর্জাতিক শান্তি ক্ষতিগ্রস্ত না হয়।\n\n### ৩. বহুপাক্ষিকতার প্রতি সম্মান\n\nরাষ্ট্রীয় সার্বভৌমত্ব বজায় রেখেও আন্তর্জাতিক আইন, চুক্তি ও সংস্থার সঙ্গে সহযোগিতা করা সম্ভব।\n\n### ৪. মানবিক মূল্যবোধ\n\nজাতীয় পরিচয়ের পাশাপাশি মানবাধিকার, শান্তি ও ন্যায়বিচারের মতো সার্বজনীন মূল্যবোধকে গুরুত্ব দিতে হবে।\n\n## উপসংহার\n\nউগ্র জাতীয়তাবাদ সংকীর্ণ স্বার্থ, জাতিগত শ্রেষ্ঠত্ব, সামরিক আগ্রাসন ও আন্তর্জাতিক আইন অমান্যকে উৎসাহিত করে। ফলে বিশ্বশান্তি, আন্তর্জাতিক সহযোগিতা ও মানবিক সংহতি হুমকির মুখে পড়ে। তবে দায়িত্বশীল ও উদার জাতীয়তাবাদ আন্তর্জাতিকতার সঙ্গে বিরোধপূর্ণ নয়। তাই জাতীয় স্বার্থকে মানবিকতা, আন্তর্জাতিক আইন ও পারস্পরিক সহযোগিতার সঙ্গে সামঞ্জস্যপূর্ণ করাই বিশ্বশান্তির জন্য অপরিহার্য।"

                    "a": "**ভূমিকা:**\n\nনেপালের মাওবাদী আন্দোলন (১৯৯৬–২০০৬) ছিল একটি দীর্ঘমেয়াদী গৃহযুদ্ধ, যা শেষ পর্যন্ত রাজতন্ত্র বিলুপ্তি ও প্রজাতন্ত্র প্রতিষ্ঠায় গুরুত্বপূর্ণ ভূমিকা রাখে। এই আন্দোলনের পেছনে ছিল গভীর সামাজিক, অর্থনৈতিক ও রাজনৈতিক অসন্তোষ।\n\n**গুরুত্বপূর্ণ পয়েন্টসমূহ:**\n\n১. **দারিদ্র্য ও অর্থনৈতিক বৈষম্য:** নেপালের গ্রামীণ এলাকায় চরম দারিদ্র্য, ভূমিহীনতা, বেকারত্ব ও সম্পদের অসম বণ্টন মাওবাদীদের জন্য জনসমর্থন তৈরি করে।\n\n২. **জাতিগত ও সামাজিক বৈষম্য:** তল্লিত জাতিগোষ্ঠী (জনজাতি), দলিত ও নারীদের প্রতি প্রাতিষ্ঠানিক বৈষম্য, বঞ্চনা ও অবহেলা মাওবাদী আদর্শের প্রতি আকৃষ্ট করে।\n\n৩. **রাজনৈতিক অস্থিতিশীলতা ও দুর্নীতি:** বারবার সরকার পরিবর্তন, দলীয় কোন্দল, দুর্নীতি ও দুর্বল শাসন ব্যবস্থা সাধারণ মানুষের মধ্যে রাষ্ট্রের প্রতি বিশ্বাসহীনতা তৈরি করে।\n\n৪. **রাজতন্ত্রের একচ্ছত্র ক্ষমতা:** রাজা ও রাজপরিবারের অত্যধিক হস্তক্ষেপ, গণতান্ত্রিক প্রক্রিয়ায় বাধা এবং ২০০৫ সালে রাজা জ্ঞানেন্দ্রের সরাসরি ক্ষমতা গ্রহণ মাওবাদী ও গণআন্দোলনকে শক্তিশালী করে।\n\n৫. **রাষ্ট্রীয় নিপীড়ন ও অপারেশন রোমিও:** সরকারি বাহিনীর নির্যাতন, মানবাধিকার লঙ্ঘন এবং ‘অপারেশন রোমিও’-এর মতো কঠোর অভিযান সাধারণ মানুষকে মাওবাদীদের দিকে ঠেলে দেয়।\n\n**উপসংহার:**\n\nনেপালের মাওবাদী আন্দোলন কেবল আদর্শগত নয়, বরং দারিদ্র্য, বৈষম্য, দুর্নীতি ও রাজনৈতিক সংকটের সম্মিলিত ফল। এটি শেষ পর্যন্ত ২০০৬ সালের গণআন্দোলন ও ২০০৮ সালে প্রজাতন্ত্র প্রতিষ্ঠার পথ প্রশস্ত করে।"

                    "a": "**ভূমিকা:**\n\nদক্ষিণ এশিয়ার দেশগুলো (ভারত, পাকিস্তান, বাংলাদেশ, নেপাল, শ্রীলঙ্কা, ভুটান, মালদ্বীপ, আফগানিস্তান) ঔপনিবেশিক অতীত, বৈচিত্র্যময় সমাজ ও উন্নয়নশীল অর্থনীতির মধ্য দিয়ে রাজনৈতিক আধুনিকীকরণের পথে অগ্রসর হচ্ছে। তবে এই প্রক্রিয়ায় নানা গঠনগত, সামাজিক ও প্রাতিষ্ঠানিক সমস্যা দেখা দেয়।\n\n**গুরুত্বপূর্ণ পয়েন্টসমূহ:**\n\n১. **ঔপনিবেশিক উত্তরাধিকার ও দুর্বল প্রতিষ্ঠান:** ব্রিটিশ শাসনের আমলাতান্ত্রিক ও কেন্দ্রীভূত কাঠামো স্বাধীনোত্তর সময়েও টিকে থাকে, যা গণতান্ত্রিক ও অন্তর্ভুক্তিমূলক শাসনব্যবস্থা গড়ে তুলতে বাধা দেয়।\n\n২. **দুর্নীতি ও সুশাসনের অভাব:** রাষ্ট্রীয় সম্পদ ও ক্ষমতা ব্যক্তিগত বা দলীয় স্বার্থে অপব্যবহারের প্রবণতা এই অঞ্চলের রাজনৈতিক আধুনিকীকরণের অন্যতম প্রধান সমস্যা। দুর্নীতির কারণে রাজনৈতিক প্রক্রিয়ার স্বচ্ছতা নষ্ট হয়, সুশাসনের অভাব দেখা দেয় এবং জনগণের মধ্যে রাজনীতিবিদের প্রতি অনাস্থা জন্ম নেয়।\n\n৩. **দারিদ্র্য ও অর্থনৈতিক বৈষম্য:** ব্যাপক দারিদ্র্য, ভূমিহীনতা, বেকারত্ব ও সম্পদের অসম বণ্টন রাজনৈতিক স্থিতিশীলতা ও আধুনিকীকরণে বাধা সৃষ্টি করে; দরিদ্র জনগোষ্ঠী প্রায়শই রাজনৈতিক প্রক্রিয়া থেকে বঞ্চিত থাকে।\n\n৪. **জাতিগত, ধর্মীয় ও ভাষিক বিভাজন:** বহুজাতি, বহুধর্ম ও বহুভাষিক সমাজে সংকীর্ণ পরিচয়ের রাজনীতি, সাম্প্রদায়িকতা ও জাতিগত সংঘাত রাজনৈতিক ঐক্য ও আধুনিকীকরণকে বাধাগ্রস্ত করে।\n\n৫. **সামরিক হস্তক্ষেপ ও গণতান্ত্রিক অস্থিতিশীলতা:** পাকিস্তান, বাংলাদেশ (ঐতিহাসিক), নেপাল (রাজতান্ত্রিক শাসন) ও মালদ্বীপে সামরিক বা রাজতান্ত্রিক হস্তক্ষেপ গণতান্ত্রিক প্রতিষ্ঠানগুলোকে দুর্বল করেছে।\n\n৬. **দুর্বল রাজনৈতিক দল ও ব্যক্তিকেন্দ্রিক নেতৃত্ব:** দলগুলো প্রায়শই পরিবারকেন্দ্রিক, ব্যক্তিনির্ভর ও প্রাতিষ্ঠানিকভাবে দুর্বল; এটি নীতিগত ধারাবাহিকতা ও গণতান্ত্রিক সংস্কৃতির বিকাশে বাধা দেয়।\n\n৭. **নির্বাচনী ব্যবস্থার ত্রুটি ও কারচুপি:** নির্বাচনে কারচুপি, ভোটার তালিকা জালিয়াতি, প্রশাসনিক পক্ষপাতিত্ব ও সহিংসতা গণতান্ত্রিক প্রক্রিয়াকে ক্ষতিগ্রস্ত করে।\n\n৮. **আইনের শাসনের দুর্বলতা:** বিচার বিভাগের স্বাধীনতার অভাব, রাজনৈতিক প্রভাব ও দুর্নীতির কারণে আইনের শাসন প্রতিষ্ঠিত হয় না; ফলে নাগরিক অধিকার রক্ষা কঠিন হয়।\n\n৯. **নাগরিক সমাজ ও মিডিয়ার সীমাবদ্ধতা:** নাগরিক সমাজ ও স্বাধীন মিডিয়ার ওপর সরকারি চাপ, সেন্সরশিপ ও নিরাপত্তা আইনের অপব্যবহার গণতান্ত্রিক আলোচনা ও জবাবদিহিতাকে সীমিত করে।\n\n১০. **শিক্ষা ও রাজনৈতিক সচেতনতার অভাব:** নিম্ন শিক্ষার হার, রাজনৈতিক অজ্ঞতা ও কুসংস্কার নাগরিকদের গণতান্ত্রিক প্রক্রিয়ায় সক্রিয় অংশগ্রহণে বাধা দেয়।\n\n১১. **আঞ্চলিক সংঘাত ও সীমান্ত বিরোধ:** ভারত-পাকিস্তান (কাশ্মীর), ভারত-চীন (সীমান্ত), শ্রীলঙ্কার গৃহযুদ্ধ ও নেপালের মাওবাদী আন্দোলন রাজনৈতিক স্থিতিশীলতা ও আধুনিকীকরণে নেতিবাচক প্রভাব ফেলে।\n\n১২. **বৈদেশিক হস্তক্ষেপ ও ভূ-রাজনীতি:** আঞ্চলিক ও বৈশ্বিক শক্তির (ভারত, চীন, যুক্তরাষ্ট্র) ভূ-রাজনৈতিক স্বার্থ দক্ষিণ এশিয়ার দেশগুলোর অভ্যন্তরীণ রাজনীতিতে প্রভাব ফেলে।\n\n১৩. **অর্থনৈতিক নির্ভরতা ও ঋণের বোঝা:** বৈদেশিক সাহায্য, ঋণ ও বহুজাতিক সংস্থার ওপর অত্যধিক নির্ভরতা নীতিগত স্বাধীনতা সীমিত করে।\n\n১৪. **প্রযুক্তি ও ডিজিটাল বিভাজন:** ডিজিটাল স্বাক্ষরতা ও প্রযুক্তিগত অবকাঠামোর অভাব আধুনিক গণতান্ত্রিক প্রক্রিয়া (ই-ভোটিং, তথ্য অধিকার) বাস্তবায়নে বাধা দেয়।\n\n১৫. **পরিবেশগত ও জলবায়ু সংকট:** জলবায়ু পরিবর্তন, প্রাকৃতিক দুর্যোগ ও সম্পদের সংকট রাজনৈতিক অস্থিতিশীলতা ও অভ্যন্তরীণ সংঘাতের ঝুঁকি বাড়ায়।\n\n**উপসংহার:**\n\nদক্ষিণ এশিয়ার রাজনৈতিক আধুনিকীকরণ একটি জটিল ও বহুমুখী প্রক্রিয়া; এটি সফল করতে হলে সুশাসন, দুর্নীতি দমন, শিক্ষা, প্রাতিষ্ঠানিক সংস্কার ও আঞ্চলিক সহযোগিতা অপরিহার্য।"

                    "q": "১১। ভারতের সংবিধানের বৈশিষ্ট্য আলোচনা কর।",
                    "a": "**ভূমিকা:**\n\nভারতের সংবিধান ১৯৫০ সালের ২৬ জানুয়ারি কার্যকর হয় এবং এটি বিশ্বের বৃহত্তম লিখিত সংবিধান। এটি ভারতকে একটি সার্বভৌম, সমাজতান্ত্রিক, ধর্মনিরপেক্ষ, গণতান্ত্রিক প্রজাতন্ত্র হিসেবে প্রতিষ্ঠিত করে।\n\n**গুরুত্বপূর্ণ পয়েন্টসমূহ:**\n\n১. **বিশ্বের বৃহত্তম লিখিত সংবিধান:** ভারতের সংবিধানে ২৫টি ভাগ, ৪৭০টি অনুচ্ছেদ, ১২টি তফসিল ও ১০৫টি সংশোধন রয়েছে; এটি বিস্তারিত ও জটিল।\n\n২. **সার্বভৌম গণতান্ত্রিক প্রজাতন্ত্র:** সংবিধান ভারতকে সার্বভৌম, গণতান্ত্রিক ও প্রজাতান্ত্রিক রাষ্ট্র হিসেবে ঘোষণা করে; সকল ক্ষমতার উৎস জনগণ।\n\n৩. **সমাজতান্ত্রিক ও ধর্মনিরপেক্ষ রাষ্ট্র:** ১৯৭৬ সালের ৪২তম সংশোধনের মাধ্যমে ‘সমাজতান্ত্রিক’ ও ‘ধর্মনিরপেক্ষ’ শব্দ প্রস্তাবনায় যুক্ত হয়; রাষ্ট্র সকল ধর্মের প্রতি সমান আচরণ করে।\n\n৪. **যুক্তরাষ্ট্রীয় ও এককেন্দ্রিক বৈশিষ্ট্যের মিশ্রণ:** ভারত যুক্তরাষ্ট্রীয় হলেও শক্তিশালী কেন্দ্রীয় সরকার, একক নাগরিকত্ব, সর্বভারতীয় সেবা (IAS, IPS, IFS) ও জরুরি অবস্থার বিধান এককেন্দ্রিক প্রবণতা দেখায়।\n\n৫. **সংসদীয় সরকার ব্যবস্থা:** ভারতে ব্রিটিশ মডেলের সংসদীয় ব্যবস্থা প্রবর্তিত; রাষ্ট্রপতি আনুষ্ঠানিক প্রধান, প্রকৃত ক্ষমতা প্রধানমন্ত্রী ও মন্ত্রিসভার হাতে।\n\n৬. **মৌলিক অধিকারের গ্যারান্টি:** সংবিধানের তৃতীয় ভাগে নাগরিকদের মৌলিক অধিকার (সমতা, স্বাধীনতা, শোষণবিরোধী, ধর্মীয় স্বাধীনতা, শিক্ষা-সংস্কৃতি, সাংবিধানিক প্রতিকার) নিশ্চিত করা হয়েছে।\n\n৭. **রাষ্ট্রীয় নীতির নির্দেশমূলক নীতি (DPSP):** চতুর্থ ভাগে অর্থনৈতিক ও সামাজিক গণতন্ত্র প্রতিষ্ঠার লক্ষ্যে নির্দেশমূলক নীতি দেওয়া হয়েছে; এগুলো বিচারযোগ্য নয় কিন্তু নীতি নির্ধারণে গুরুত্বপূর্ণ।\n\n৮. **মৌলিক কর্তব্য:** ১৯৭৬ সালের ৪২তম সংশোধনের মাধ্যমে নাগরিকদের মৌলিক কর্তব্য (অনুচ্ছেদ ৫১A) যুক্ত করা হয়; এগুলো নাগরিকদের দায়িত্ববোধ তৈরি করে।\n\n৯. **স্বাধীন বিচার বিভাগ ও বিচারিক পর্যালোচনা:** সুপ্রিম কোর্ট ও হাইকোর্ট সংবিধানের রক্ষক; তারা আইন ও সরকারি কার্যক্রমের সাংবিধানিকতা পর্যালোচনা করতে পারে।\n\n১০. **নির্বাচন কমিশনের স্বাধীনতা:** সংবিধান একটি স্বাধীন ও নিরপেক্ষ নির্বাচন কমিশন প্রতিষ্ঠা করে, যা নিয়মিত ও সুষ্ঠু নির্বাচন পরিচালনা করে।\n\n১১. **জরুরি অবস্থার বিধান:** সংবিধানে জাতীয়, রাজ্য ও আর্থিক জরুরি অবস্থার বিধান রয়েছে; এটি কেন্দ্রীয় সরকারকে অসাধারণ ক্ষমতা দেয়।\n\n১২. **একক নাগরিকত্ব:** ভারতে দ্বৈত নাগরিকত্ব নেই; সকল নাগরিকের জন্য একক নাগরিকত্বের ব্যবস্থা রয়েছে, যা জাতীয় ঐক্যকে শক্তিশালী করে।\n\n১৩. **সংশোধন প্রক্রিয়া:** সংবিধান আংশিক নমনীয় ও আংশিক কঠোর; কিছু অনুচ্ছেদ সহজে, কিছু কঠোরভাবে এবং কিছু ক্ষেত্রে রাজ্যের অনুমোদন প্রয়োজন।\n\n১৪. **প্রস্তাবনা (Preamble):** সংবিধানের প্রস্তাবনায় এর নৈতিক আদর্শ, মূল উদ্দেশ্য (ন্যায়, স্বাধীনতা, সমতা, বন্ধুত্ব) ও দর্শন ব্যক্ত করা হয়েছে।\n\n১৫. **ভাষাগত বৈচিত্র্য ও রাজ্য পুনর্গঠন:** সংবিধান ভাষাগত ভিত্তিতে রাজ্য পুনর্গঠনের অনুমোদন দেয়; এটি বৈচিত্র্যকে স্বীকার করে এবং জাতীয় ঐক্যকে শক্তিশালী করে।\n\n**উপসংহার:**\n\nভারতের সংবিধান একটি জীবন্ত দলিল, যা বৈচিত্র্যময় সমাজে গণতন্ত্র, মৌলিক অধিকার, সুশাসন ও জাতীয় ঐক্য রক্ষায় গুরুত্বপূর্ণ ভূমিকা রাখে।"

                    "a": "**ভূমিকা:**\n\nপাকিস্তান একটি বহুজাতি, বহুভাষিক ও বহুধর্মীয় রাষ্ট্র; তবে স্বাধীনতার পর থেকেই এটি জাতীয় সংহতি ও ঐক্যের নানা চ্যালেঞ্জের মুখে রয়েছে।\n\n**গুরুত্বপূর্ণ পয়েন্টসমূহ:**\n\n১. **জাতিগত ও প্রাদেশিক বিভাজন:** পাঞ্জাব, সিন্ধু, বেলুচিস্তান ও খাইবার পাখতুনখোয়ার মধ্যে জাতিগত, ভাষিক ও প্রাদেশিক বৈষম্য জাতীয় ঐক্যকে দুর্বল করে।\n\n২. **ভাষিক সংঘাত:** উর্দুকে একমাত্র রাষ্ট্রভাষা ঘোষণা ও আঞ্চলিক ভাষা (সিন্ধি, পাঞ্জাবি, বেলুচি, পশতু) অবমূল্যায়ন ভাষিক সংঘাতের জন্ম দেয়।\n\n৩. **অর্থনৈতিক বৈষম্য:** প্রাদেশিক ও জাতিগত ভিত্তিতে সম্পদ, উন্নয়ন ও চাকরির বৈষম্য জাতীয় সংহতিকে ক্ষতিগ্রস্ত করে।\n\n৪. **ধর্মীয় ও সম্প্রদায়িক বিভাজন:** সুন্নি-শিয়া, দেওবন্দী-বেরেলভী ও অন্যান্য ধর্মীয় গোষ্ঠীর মধ্যে সংঘাত জাতীয় ঐক্যকে দুর্বল করে।\n\n৫. **সামরিক হস্তক্ষেপ ও গণতান্ত্রিক অস্থিতিশীলতা:** বারবার সামরিক শাসন ও গণতান্ত্রিক প্রক্রিয়ার ব্যাঘাত জাতীয় সংহতি ও রাজনৈতিক স্থিতিশীলতাকে ক্ষতিগ্রস্ত করে।\n\n৬. **দুর্নীতি ও দুর্নীতিগ্রস্ত শাসন ব্যবস্থা:** দুর্নীতি, সুশাসনের অভাব ও প্রশাসনিক অদক্ষতা জনগণের মধ্যে রাষ্ট্রের প্রতি বিশ্বাসহীনতা তৈরি করে।\n\n৭. **সন্ত্রাসবাদ ও চরমপন্থা:** তালেবান, আল-কায়েদা ও অন্যান্য চরমপন্থী গোষ্ঠীর কার্যক্রম জাতীয় নিরাপত্তা ও ঐক্যকে হুমকির মুখে ফেলে।\n\n৮. **আফগানিস্তান যুদ্ধের প্রভাব:** সোভিয়েত-আফগান যুদ্ধ ও পরবর্তীকালে আফগানিস্তানে মার্কিন হস্তক্ষেপ পাকিস্তানে সন্ত্রাসবাদ ও চরমপন্থা ছড়িয়ে দেয়।\n\n৯. **নেতৃত্বের সংকট:** রাজনৈতিক নেতাদের মধ্যে দক্ষতার অভাব, দলীয় কোন্দল ও ব্যক্তিকেন্দ্রিক নেতৃত্ব জাতীয় সংহতি গঠনে বাধা দেয়।\n\n১০. **শিক্ষা ও সামাজিক সচেতনতার অভাব:** নিম্ন শিক্ষার হার, কুসংস্কার ও ধর্মীয় কট্টরতা জাতীয় ঐক্য ও আধুনিকীকরণে বাধা দেয়।\n\n১১. **মিডিয়া ও তথ্যের প্রভাব:** পক্ষপাতিত্বপূর্ণ মিডিয়া, প্রোপাগান্ডা ও তথ্যের অপব্যবহার জনমতকে বিভক্ত করে।\n\n১২. **বৈদেশিক হস্তক্ষেপ:** যুক্তরাষ্ট্র, ভারত, চীন ও অন্যান্য শক্তির ভূ-রাজনৈতিক স্বার্থ পাকিস্তানের অভ্যন্তরীণ রাজনীতিতে প্রভাব ফেলে।\n\n১৩. **অর্থনৈতিক সংকট ও ঋণের বোঝা:** উচ্চ মুদ্রাস্ফীতি, বেকারত্ব, বৈদেশিক ঋণ ও অর্থনৈতিক অস্থিতিশীলতা জনরোষ ও সামাজিক বিভাজন বাড়ায়।\n\n১৪. **সংবিধান ও যুক্তরাষ্ট্রীয় ব্যবস্থার দুর্বলতা:** প্রাদেশিক স্বায়ত্তশাসনের অভাব ও কেন্দ্রীয় সরকারের অত্যধিক ক্ষমতা প্রাদেশিক অসন্তোষ তৈরি করে।\n\n১৫. **জাতীয় পরিচয়ের সংকট:** ইসলামি রাষ্ট্র, আধুনিক রাষ্ট্র ও জাতিগত পরিচয়ের মধ্যে দ্বন্দ্ব জাতীয় সংহতি গঠনে বাধা দেয়।\n\n**উপসংহার:**\n\nপাকিস্তানের জাতীয় সংহতি গঠন একটি জটিল ও বহুমুখী চ্যালেঞ্জ; এটি সমাধান করতে হলে অর্থনৈতিক ন্যায়বিচার, প্রাদেশিক স্বায়ত্তশাসন, শিক্ষা, সুশাসন ও জাতীয় ঐক্যের চেতনা প্রয়োজন।"

                    "a": "**ভূমিকা:**\n\nশ্রীলঙ্কা একটি অর্ধ-রাষ্ট্রপতিশাসিত গণতান্ত্রিক প্রজাতন্ত্র; এখানে রাষ্ট্রপতি সরাসরি জনগণের ভোটে নির্বাচিত হন এবং নির্বাহী ক্ষমতার অধিকারী।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n**গুরুত্বপূর্ণ পয়েন্টসমূহ:**\n\n১. **সরাসরি জনগণের ভোট:** রাষ্ট্রপতি সরাসরি জনগণের ভোটে নির্বাচিত হন; এটি গণতান্ত্রিক বৈধতা ও জনসমর্থন নিশ্চিত করে।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n২. **মেয়াদ ও পুনর্নির্বাচন:** রাষ্ট্রপতির মেয়াদ ৫ বছর; ১৯তম সংশোধনী অনুযায়ী একজন সর্বোচ্চ দুই মেয়াদের জন্য নির্বাচিত হতে পারেন।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n৩. **প্রাধান্যভিত্তিক ভোট পদ্ধতি (Ranked Voting):** ভোটাররা একজন প্রার্থীকে প্রথম পছন্দ হিসেবে ভোট দেন এবং দুটি অতিরিক্ত পছন্দ (দ্বিতীয় ও তৃতীয়) উল্লেখ করতে পারেন।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n৪. **সংখ্যাগরিষ্ঠতার প্রয়োজনীয়তা:** যদি কোনো প্রার্থী প্রথম পছন্দের ভোটে ৫০%+১ ভোট পান, তবে তিনি সরাসরি নির্বাচিত ঘোষিত হন।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n৫. **দ্বিতীয় ধাপের গণনা:** যদি কেউ প্রথম ধাপে সংখ্যাগরিষ্ঠতা না পান, তবে শীর্ষ দুই প্রার্থী বাদে বাকিরা বাদ যান; বাদ পড়া প্রার্থীদের দ্বিতীয় ও তৃতীয় পছন্দের ভোট শীর্ষ দুই প্রার্থীর মধ্যে বণ্টন করা হয়।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n৬. **নির্বাচন কমিশনের ভূমিকা:** স্বাধীন নির্বাচন কমিশন নির্বাচন পরিচালনা, ভোটার তালিকা প্রস্তুত ও ফলাফল ঘোষণা করে।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n৭. **প্রার্থীর যোগ্যতা:** প্রার্থীকে শ্রীলঙ্কার নাগরিক, কমপক্ষে ৩৫ বছর বয়সী এবং সংসদ সদস্য হওয়ার যোগ্য হতে হয়।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n৮. **মনোনয়ন ও জমা:** প্রার্থীরা নির্বাচন কমিশনে মনোনয়নপত্র জমা দেন; নির্দিষ্ট সংখ্যক সমর্থক ও জমার প্রয়োজন হয়।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n৯. **নির্বাচনী প্রচার ও ব্যয় সীমা:** প্রচারের জন্য নির্দিষ্ট সময় ও ব্যয় সীমা থাকে; নির্বাচন কমিশন এটি তদারকি করে।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n১০. **ভোটগ্রহণ ও গণনা:** ভোটগ্রহণ একদিনে সারা দেশে অনুষ্ঠিত হয়; গণনা কেন্দ্রীয়ভাবে করা হয় এবং ফলাফল ঘোষণা করা হয়।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n১১. **রাষ্ট্রপতির ক্ষমতা:** রাষ্ট্রপতি প্রধানমন্ত্রী ও মন্ত্রিসভা নিয়োগ ও বরখাস্ত করতে পারেন; তিনি সশস্ত্র বাহিনীর সর্বাধিনায়ক।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n১২. **অর্ধ-রাষ্ট্রপতিশাসিত ব্যবস্থা:** শ্রীলঙ্কায় রাষ্ট্রপতি ও প্রধানমন্ত্রী উভয়েই নির্বাহী ক্ষমতার অধিকারী; এটি ফরাসি মডেলের অনুরূপ।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n১৩. **মহাপ্রার্থী ও জোটবদ্ধ রাজনীতি:** প্রায়শই বড় দলগুলো জোটবদ্ধ হয়ে প্রার্থী দেয়; এটি ভোট বিভাজন রোধ করে।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n১৪. **নির্বাচনী পর্যবেক্ষণ:** আন্তর্জাতিক ও স্থানীয় পর্যবেক্ষক দল নির্বাচন তদারকি করে; এটি স্বচ্ছতা ও গণতান্ত্রিক বৈধতা নিশ্চিত করে।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n১৫. **নির্বাচনী সংস্কার:** ১৯তম ও ২০তম সংশোধনীর মাধ্যমে রাষ্ট্রপতির ক্ষমতা ও মেয়াদ সীমিত করা হয়েছে; এটি গণতান্ত্রিক ভারসাম্য তৈরি করে।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]\n\n**উপসংহার:**\n\nশ্রীলঙ্কার রাষ্ট্রপতি নির্বাচন পদ্ধতি গণতান্ত্রিক, স্বচ্ছ ও জনগণের সরাসরি অংশগ্রহণ নিশ্চিত করে; প্রাধান্যভিত্তিক ভোট পদ্ধটি সংখ্যাগরিষ্ঠতা ও স্থিতিশীল সরকার গঠনে সহায়ক।\\[[europarl.europa](https://www.europarl.europa.eu/RegData/etudes/BRIE/2024/762394/EPRS_BRI\\(2024\\)762394_EN.pdf)\\]"
          },

                    "id": "q123",
                    "examType": "test",
                    "subjectId": "231905",
                    "section": "ga",
                    "q": "১৬। দক্ষিণ এশিয়ার রাজনীতি ও অর্থনীতিতে বিশ্বায়নের প্রভাব আলোচনা কর।",
                    "a": "**ভূমিকা:**\n\nবিশ্বায়ন একটি বহুমুখী প্রক্রিয়া, যা বাণিজ্য, বিনিয়োগ, প্রযুক্তি, সংস্কৃতি ও রাজনৈতিক সহযোগিতার মাধ্যমে দেশগুলোর মধ্যে আন্তঃনির্ভরতা বাড়ায়। দক্ষিণ এশিয়ার দেশগুলো বিশ্বায়নের মাধ্যমে উন্নয়ন ও আধুনিকীকরণের সুযোগ পেলেও নানা চ্যালেঞ্জেরও মুখে পড়েছে।\n\n**গুরুত্বপূর্ণ পয়েন্টসমূহ:**\n\n১. **অর্থনৈতিক বৃদ্ধি ও বাণিজ্য প্রসার:** বিশ্বায়নের ফলে দক্ষিণ এশিয়ার দেশগুলো উন্নত বাজারের সাথে যুক্ত হওয়ার সুযোগ পেয়েছে; বহুজাতিক সংস্থাগুলির (MNCs) আগমন এবং প্রত্যক্ষ বৈদেশিক বিনিয়োগ (FDI) বৃদ্ধি পেয়েছে, যা অর্থনৈতিক প্রবৃদ্ধি ও কর্মসংস্থান সৃষ্টিতে গুরুত্বপূর্ণ ভূমিকা রেখেছে।\n\n২. **বাণিজ্য উদারীকরণ ও WTO:** বিশ্ব বাণিজ্য সংস্থার (WTO) নিয়ম ও বাণিজ্য উদারীকরণের ফলে আমদানি-রপ্তানি বাধা কমেছে; এটি আঞ্চলিক বাণিজ্য ও বৈশ্বিক বাজারে প্রবেশের সুযোগ তৈরি করেছে।\n\n৩. **প্রযুক্তি ও ডিজিটাল বিপ্লব:** তথ্যপ্রযুক্তি, ইন্টারনেট ও ডিজিটাল প্ল্যাটফর্মের প্রসার শিক্ষা, স্বাস্থ্য, ব্যাংকিং ও বাণিজ্যে বিপ্লব ঘটিয়েছে; এটি দক্ষিণ এশিয়ার অর্থনীতিকে আধুনিক করেছে।\n\n৪. **শ্রমবাজার ও প্রবাসী আয়:** মধ্যপ্রাচ্য, ইউরোপ ও উত্তর আমেরিকায় শ্রম অভিবাসন বৃদ্ধি পেয়েছে; প্রবাসী আয় দক্ষিণ এশিয়ার অর্থনীতিতে গুরুত্বপূর্ণ ভূমিকা রাখে।\n\n৫. **আঞ্চলিক সহযোগিতা ও SAARC:** বিশ্বায়ন আঞ্চলিক সহযোগিতা (SAARC, BIMSTEC)কে উৎসাহিত করেছে; এটি বাণিজ্য, নিরাপত্তা ও উন্নয়নে সহায়ক হয়েছে।\n\n৬. **বৈদেশিক ঋণ ও সহায়তা:** বিশ্বব্যাংক, আইএমএফ ও এশীয় উন্নয়ন ব্যাংকের মতো প্রতিষ্ঠান থেকে ঋণ ও সহায়তা অবকাঠামো ও উন্নয়ন প্রকল্পে ব্যবহৃত হয়েছে।\n\n৭. **রাজনৈতিক গণতন্ত্র ও সুশাসন:** বিশ্বায়ন গণতান্ত্রিক মূল্যবোধ, মানবাধিকার ও সুশাসনের প্রসারে সহায়ক হয়েছে; আন্তর্জাতিক চাপ ও সহযোগিতা সংস্কারে উৎসাহিত করেছে।\n\n৮. **সামাজিক ও সাংস্কৃতিক পরিবর্তন:** পশ্চিমা সংস্কৃতি, শিক্ষা ও জীবনযাত্রার প্রভাব দক্ষিণ এশিয়ার সমাজে নতুন মূল্যবোধ ও চাহিদা তৈরি করেছে।\n\n৯. **অর্থনৈতিক বৈষম্য ও চ্যালেঞ্জ:** বিশ্বায়ন কিছু ক্ষেত্রে ধনী-দরিদ্রের ব্যবধান বাড়িয়েছে; ক্ষুদ্র ও কুটির শিল্প প্রতিযোগিতায় পিছিয়ে পড়েছে।\n\n১০. **পরিবেশগত প্রভাব:** শিল্পায়ন, নগরায়ন ও প্রাকৃতিক সম্পদের অত্যধিক ব্যবহার পরিবেশ দূষণ ও জলবায়ু পরিবর্তনের ঝুঁকি বাড়িয়েছে।\n\n১১. **নিরাপত্তা ও সন্ত্রাসবাদ:** বিশ্বায়ন সীমান্ত, অনুপ্রবেশ ও সন্ত্রাসবাদের মতো নিরাপত্তা চ্যালেঞ্জও বাড়িয়েছে; আন্তর্জাতিক সন্ত্রাসী নেটওয়ার্ক দক্ষিণ এশিয়ায় সক্রিয় হয়েছে।\n\n১২. **স্বাস্থ্য ও মহামারী:** কোভিড-১৯ এর মতো মহামারী বিশ্বায়নের মাধ্যমে দ্রুত ছড়িয়ে পড়ে; এটি স্বাস্থ্য ব্যবস্থা ও অর্থনীতিতে চাপ সৃষ্টি করেছে।\n\n১৩. **শিক্ষা ও গবেষণা সহযোগিতা:** আন্তর্জাতিক বিশ্ববিদ্যালয়, গবেষণা প্রতিষ্ঠান ও শিক্ষা বিনিময় কর্মসূচি দক্ষিণ এশিয়ার শিক্ষা ও গবেষণাকে উন্নত করেছে।\n\n১৪. **রাজনৈতিক সার্বভৌমতা ও হস্তক্ষেপ:** বিশ্বায়ন কখনো কখনো বৈদেশিক হস্তক্ষেপ ও সার্বভৌমতা সীমিত করার ঝুঁকি তৈরি করে; এটি রাজনৈতিক সংবেদনশীলতা বাড়ায়।\n\n১৫. **ভবিষ্যৎ সম্ভাবনা ও চ্যালেঞ্জ:** বিশ্বায়ন দক্ষিণ এশিয়াকে উন্নয়ন ও আধুনিকীকরণের সুযোগ দিলেও বৈষম্য, পরিবেশ ও নিরাপত্তা চ্যালেঞ্জ মোকাবিলায় কৌশলগত পরিকল্পনা প্রয়োজন।\n\n**উপসংহার:**\n\nবিশ্বায়ন দক্ষিণ এশিয়ার রাজনীতি ও অর্থনীতিতে গভীর ও বহুমুখী প্রভাব ফেলেছে; এটি উন্নয়ন ও আধুনিকীকরণের সুযোগ দিলেও বৈষম্য, পরিবেশ ও নিরাপত্তা চ্যালেঞ্জও তৈরি করেছে।"

বিধানকে স্থিতিশীল ও নমনীয় রাখে।\n\n১৩. **প্রস্তাবনা (Preamble):** সংবিধানের প্রস্তাবনায় এর নৈতিক আদর্শ, মূল উদ্দেশ্য (ন্যায়, স্বাধীনতা, সমতা, বন্ধুত্ব) ও দর্শন ব্যক্ত করা হয়েছে।\n\n১৪. **মানবাধিকার ও জাতীয় মানবাধিকার কমিশন:** সংবিধান মানবাধিকার রক্ষায় জাতীয় মানবাধিকার কমিশন প্রতিষ্ঠা করে; এটি নাগরিক অধিকার রক্ষায় গুরুত্বপূর্ণ।\n\n১৫. **স্থানীয় স্বায়ত্তশাসন:** সংবিধান স্থানীয় পর্যায় (গ্রাম ও নগর পরিষদ)কে স্বায়ত্তশাসন ও ক্ষমতা দেয়; এটি গণতান্ত্রিক প্রক্রিয়াকে শক্তিশালী করে।\n\n**উপসংহার:**\n\nনেপালের সংবিধান একটি আধুনিক, গণতান্ত্রিক ও অন্তর্ভুক্তিমূলক দলিল, যা যুক্তরাষ্ট্রীয়তা, মৌলিক অধিকার, সুশাসন ও জাতীয় ঐক্য রক্ষায় গুরুত্বপূর্ণ ভূমিকা রাখে।"

          document.documentElement.classList.add('dark');
      } else {
          document.documentElement.classList.remove('dark');
      }
    });

    // Helper to hide all views
    function hideAllViews() {
        homeView.classList.remove('active', 'exit');
        subjectsView.classList.remove('active');
        questionsView.classList.remove('active');
        singleAnswerView.classList.remove('active');
    }

    // --- History API wrappers ---
    function openExam(examType) {
        history.pushState({ view: 'subjects', examType }, '', '');
        doOpenExam(examType);
    }
    
    function backToMain() {
        history.back();
    }
    
    function openSubject(id, title) {
        history.pushState({ view: 'questions', examType: currentExamType, subjectId: id, title }, '', '');
        doOpenSubject(id, title);
    }
    
    function backToSubjects() {
        history.back();
    }
    
    function showSingleAnswer(question, answer) {
        history.pushState({ view: 'answer', question, answer, examType: currentExamType, subjectId: currentSubjectId }, '', '');
        doShowSingleAnswer(question, answer);
    }
    
    function backToQuestions() {
        history.back();
    }

    // --- Implementations ---
    function doOpenExam(examType) {
        currentExamType = examType;
        
        let title = '';
        let themeClass = '';
        if (examType === 'incourse1') { title = '1st Incourse Subjects'; themeClass = 'p1'; }
        else if (examType === 'incourse2') { title = '2nd Incourse Subjects'; themeClass = 'p2'; }
        else if (examType === 'test') { title = 'Test Exam Subjects'; themeClass = 'p3'; }
        
        document.getElementById('subjects-view-title').textContent = title;
        
        // Apply theme color to subjects view
        subjectsView.className = 'page subjects active ' + themeClass;
        
        hideAllViews();
        homeView.classList.add('exit');
        subjectsView.classList.add('active');
        
        renderSubjects();
    }

    function doBackToMain() {
        hideAllViews();
        homeView.classList.add('active'); // active translates to 0
    }

    function doOpenSubject(id, title) {
        currentSubjectId = id;
        document.getElementById('current-subject-title').textContent = title;
        
        // Pass theme class to questions view
        let themeClass = '';
        if (currentExamType === 'incourse1') { themeClass = 'p1'; }
        else if (currentExamType === 'incourse2') { themeClass = 'p2'; }
        else if (currentExamType === 'test') { themeClass = 'p3'; }
        questionsView.className = 'page subjects active ' + themeClass;
        
        hideAllViews();
        homeView.classList.add('exit');
        questionsView.classList.add('active');
        
        renderQuestions(id);
    }

    function doBackToSubjects() {
        // Just re-open the exam view
        doOpenExam(currentExamType);
    }

    function doShowSingleAnswer(question, answer) {
        document.getElementById('single-question-title').textContent = question;
        document.getElementById('single-answer-content').innerHTML = marked.parse(answer);
        
        // Apply theme to answer view
        let themeClass = '';
        if (currentExamType === 'incourse1') { themeClass = 'p1'; }
        else if (currentExamType === 'incourse2') { themeClass = 'p2'; }
        else if (currentExamType === 'test') { themeClass = 'p3'; }
        singleAnswerView.className = 'page subjects active ' + themeClass;
        
        hideAllViews();
        homeView.classList.add('exit');
        singleAnswerView.classList.add('active');
    }

    function doBackToQuestions() {
        // Find subject title from SUBJECTS list
        const bnToEn = { '০': '0', '১': '1', '২': '2', '৩': '3', '৪': '4', '৫': '5', '৬': '6', '৭': '7', '৮': '8', '৯': '9' };
        const subject = SUBJECTS.find(s => {
            const enId = s.code.replace(/[০-৯]/g, m => bnToEn[m]);
            return enId === currentSubjectId;
        });
        const title = subject ? `${subject.name} (${subject.code})` : 'Subject';
        doOpenSubject(currentSubjectId, title);
    }

    window.addEventListener('popstate', (event) => {
        const state = event.state;
        if (!state) {
            doBackToMain();
            return;
        }

        if (state.view === 'subjects') {
            doOpenExam(state.examType);
        } else if (state.view === 'questions') {
            currentExamType = state.examType; 
            doOpenSubject(state.subjectId, state.title);
        } else if (state.view === 'answer') {
            currentExamType = state.examType;
            currentSubjectId = state.subjectId;
            doShowSingleAnswer(state.question, state.answer);
        }
    });

    // --- Rendering Logic ---
    const SUBJECTS = [
      { name: "বাংলাদেশের রাজনৈতিক ও সাংবিধানিক উন্নয়ন", code: "২৩১৯০১" },
      { name: "আন্তর্জাতিক রাজনীতির মূলনীতি", code: "২৩১৯০৩" },
      { name: "দক্ষিণ এশিয়ার সরকার ও রাজনীতি (ভারত, পাকিস্তান, নেপাল ও শ্রীলঙ্কা)", code: "২৩১৯০৫" },
      { name: "রাজনীতি অধ্যয়ন পদ্ধতি", code: "২৩১৯০৭" },
      { name: "শান্তি ও সংঘর্ষ অধ্যয়ন পরিচিতি", code: "২৩১৯০৯" },
      { name: "বাংলাদেশের লোক প্রশাসন", code: "২৩১৯১১" },
      { name: "গবেষণা পদ্ধতি ও পরিসংখ্যান", code: "২৩১৯১৩" },
      { name: "রাজনৈতিক সমাজবিজ্ঞান", code: "২৩১৯১৫" }
    ];

    function renderSubjects() {
        const container = document.getElementById('subjects-list-container');
        container.innerHTML = '';
        
        SUBJECTS.forEach(subject => {
            const btn = document.createElement('button');
            btn.className = 'subject-card';
            btn.innerHTML = `
              <div>
                <div class="subject-name">${subject.name}</div>
                <div class="subject-code">Course Code: <span class="bn-num">${subject.code}</span></div>
              </div>
              <svg class="arrow" viewBox="0 0 24 24"><path d="M8 5l8 7-8 7"/></svg>
            `;
            const fullTitle = `${subject.name} (${subject.code})`;
            // Note: our old id was just the code numbers
            const id = subject.code.replace(/[^0-9]/g, '');
            // Convert bengali digits to english digits for ID matching
            const bnToEn = { '০': '0', '১': '1', '২': '2', '৩': '3', '৪': '4', '৫': '5', '৬': '6', '৭': '7', '৮': '8', '৯': '9' };
            const enId = subject.code.replace(/[০-৯]/g, m => bnToEn[m]);
            
            btn.addEventListener('click', () => openSubject(enId, fullTitle));
            container.appendChild(btn);
        });
    }

    function renderQuestions(subjectId) {
        const container = document.getElementById('questions-list-container');
        container.innerHTML = '';
        
        const qList = allQuestions.filter(q => q.subjectId === subjectId && q.examType === currentExamType);
        
        if (qList.length === 0) {
            container.innerHTML = '<p style="padding:20px; color:var(--ink-dim)">No questions uploaded yet.</p>';
            return;
        }

        const kaQs = qList.filter(q => q.section === 'ka');
        const khaQs = qList.filter(q => q.section === 'kha');
        const gaQs = qList.filter(q => q.section === 'ga');

        if (kaQs.length > 0) {
            container.appendChild(createSectionHeader('ক বিভাগ (অতি সংক্ষিপ্ত প্রশ্ন)'));
            kaQs.forEach(item => container.appendChild(createQACard(item.q, item.a)));
        }

        if (khaQs.length > 0) {
            container.appendChild(createSectionHeader('খ বিভাগ (সংক্ষিপ্ত প্রশ্ন)'));
            khaQs.forEach(item => container.appendChild(createQACard(item.q, item.a, true)));
        }

        if (gaQs.length > 0) {
            container.appendChild(createSectionHeader('গ বিভাগ (রচনামূলক প্রশ্ন)'));
            gaQs.forEach(item => container.appendChild(createQACard(item.q, item.a, true)));
        }
    }

    function createSectionHeader(title) {
        const div = document.createElement('div');
        div.className = 'section-header';
        div.innerHTML = `
            <div class="section-header-line"></div>
            <h3 class="section-header-title">${title}</h3>
            <div class="section-header-line"></div>
        `;
        return div;
    }

    function createQACard(question, answer, clickable = false) {
        const card = document.createElement(clickable ? 'button' : 'div');
        card.className = 'qa-card group';
        if (clickable) {
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
                    <h4 style="font-size:16px; font-weight:600; color:var(--ink); line-height:1.4;">${question}</h4>
                    <svg style="width:20px; height:20px; flex-shrink:0; stroke:var(--gold); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; margin-top:2px;" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
                </div>
            `;
            card.addEventListener('click', () => showSingleAnswer(question, answer));
        } else {
            card.innerHTML = `
                <h4 style="font-size:16px; font-weight:600; color:var(--ink); line-height:1.4; margin-bottom:8px;">${question}</h4>
                <div style="font-size:15px; color:var(--ink-dim); line-height:1.6;">
                    <span style="font-weight:700; color:var(--gold); margin-right:4px;">উত্তর:</span> 
                    ${answer}
                </div>
            `;
        }
        return card;
    }
  </script>
</body>
</html>
